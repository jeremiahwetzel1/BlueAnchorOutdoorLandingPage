<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Anchor Outdoors | Text for Same Day Quote | First-Time Bonus</title>
    <meta name="description" content="Young, local brothers providing pressure washing, lawn care & outdoor services. Text us for same-day free quote + first-time bonus!">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        #contact-form {
            scroll-margin-top: 120px;
        }
        html {
            scroll-behavior: smooth;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            line-height: 1.6;
            background: #fff;
            padding-top: 110px;
        }

        /* Quick Jump Menu - Redesigned with glassmorphism */
        .quick-jump-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .quick-jump-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .quick-jump-links {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .quick-jump-links.open {
            max-height: none;
        }

        .quick-jump-links a {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-jump-links a:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .quick-jump-links a.primary-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .quick-jump-links a.primary-btn:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.6);
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(59, 130, 246, 0.2);
            z-index: 998;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #3b82f6, #10b981);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Header */
        .header {
            position: fixed;
            top: 52px;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #3b82f6;
            padding: 12px 20px;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
        }

        .logo-icon {
            font-size: 1.6rem;
        }

        .header-text {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .header-text a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            background: url('https://storage.googleapis.com/msgsndr/bTvqGwhxsMeTGtI2UvsI/media/695832b9f0b9cffd7911bbd3.jpeg') no-repeat center center/cover;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 200px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            text-align: left;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            line-height: 1.1;
            letter-spacing: -2px;
            animation: fadeInUp 0.8s ease-out;
        }

        .hero-tagline {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #3b82f6;
            animation: fadeInUp 1s ease-out;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 40px;
            animation: fadeInUp 1.2s ease-out;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 1.4s ease-out;
        }

        .btn {
            padding: 18px 36px;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(59, 130, 246, 0.5);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Discount Banner - Updated cities */
        .discount-banner {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            margin-top: 50px;
        }

        .discount-banner span {
            font-size: 1.4rem;
            display: inline-block;
            margin: 0 8px;
        }

        /* Estimator Section */
        .estimator-section {
            padding: 80px 20px;
            background: linear-gradient(to bottom, #f0f9ff, #fff);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .section-subtitle {
            font-size: 1.25rem;
            color: #64748b;
            max-width: 600px;
            margin: 0 auto;
        }

        .estimator-box {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border: 3px solid #3b82f6;
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.15);
        }

        .estimator-step, .estimator-result {
            text-align: center;
        }

        .estimator-question {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 32px;
        }

        .estimator-options {
            display: grid;
            gap: 16px;
        }

        .estimator-btn {
            padding: 18px 24px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .estimator-btn:hover {
            border-color: #3b82f6;
            background: #f0f9ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15);
        }

        .estimate-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .estimate-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 16px;
        }

        .estimate-price {
            font-size: 3rem;
            font-weight: 900;
            color: #10b981;
            margin: 20px 0;
        }

        .estimate-note {
            color: #64748b;
            font-size: 1rem;
            margin-top: 16px;
        }

        .estimator-reset {
            margin-top: 20px;
            padding: 12px 24px;
            background: transparent;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .estimator-reset:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .hidden {
            display: none !important;
        }

        /* Job Tracker Section - Updated */
        .job-tracker-section {
            padding: 60px 20px;
            background: white;
        }

        .tracker-box {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .tracker-map {
            background: white;
            border-radius: 12px;
            padding: 32px;
            margin-top: 24px;
            border: 2px solid #3b82f6;
        }

        .tracker-locations {
            display: grid;
            gap: 16px;
            margin-top: 20px;
        }

        .tracker-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: #f0f9ff;
            border-radius: 12px;
            border-left: 4px solid #10b981;
        }

        .tracker-icon {
            font-size: 2rem;
        }

        .tracker-info {
            flex: 1;
        }

        .tracker-location {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.1rem;
        }

        .tracker-status {
            color: #64748b;
            font-size: 0.95rem;
        }

        .tracker-badge {
            background: #10b981;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* Services Grid */
        .services-section {
            padding: 80px 20px;
            background: linear-gradient(to bottom, #f8fafc, #fff);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
            margin-top: 50px;
        }

        .service-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 36px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to right, #3b82f6, #10b981);
            transform: scaleX(0);
            transition: transform 0.4s;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .service-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .service-desc {
            color: #64748b;
            line-height: 1.7;
            font-size: 1rem;
        }

        /* Before/After Gallery */
        .gallery-section {
            padding: 80px 20px;
            background: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
            margin-top: 50px;
        }

        .gallery-item {
            background: #f8fafc;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            border: 2px solid #e2e8f0;
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border-color: #3b82f6;
        }

        .gallery-image {
            width: 100%;
            height: 280px;
            position: relative;
            overflow: hidden;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slider-images {
            display: flex;
            transition: transform 0.4s ease-in-out;
            height: 100%;
        }

        .slider-image {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.3s;
        }

        .slider-nav:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .slider-nav.prev {
            left: 10px;
        }

        .slider-nav.next {
            right: 10px;
        }

        .slider-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .slider-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .slider-dot.active {
            background: white;
            width: 24px;
            border-radius: 4px;
        }

        .before-after-label {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            z-index: 10;
        }

        .gallery-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .gallery-caption {
            padding: 24px;
        }

        .gallery-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .gallery-meta {
            font-size: 0.95rem;
            color: #64748b;
        }

        /* FAQ Section - Updated without insurance question */
        .faq-section {
            padding: 80px 20px;
            background: #f8fafc;
        }

        .faq-container {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            gap: 16px;
        }

        .faq-item {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .faq-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.1);
        }

        .faq-question {
            padding: 24px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: #0f172a;
        }

        .faq-arrow {
            font-size: 1rem;
            transition: transform 0.3s;
            color: #3b82f6;
        }

        .faq-item.active .faq-arrow {
            transform: rotate(180deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            padding: 0 28px;
            color: #64748b;
            line-height: 1.7;
            font-size: 1rem;
        }

        .faq-item.active .faq-answer {
            max-height: 500px;
            padding: 0 28px 24px;
        }

        /* Discount Picker - Updated offers */
        .discount-picker-section {
            padding: 60px 20px;
            background: linear-gradient(135deg, #f0f9ff, #dbeafe);
        }

        .discount-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1000px;
            margin: 40px auto 0;
        }

        .discount-card {
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
        }

        .discount-card:hover {
            transform: translateY(-8px);
            border-color: #3b82f6;
            box-shadow: 0 20px 50px rgba(59, 130, 246, 0.2);
        }

        .discount-card.selected {
            border-color: #10b981;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            box-shadow: 0 15px 40px rgba(16, 185, 129, 0.3);
        }

        .discount-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        .discount-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .discount-desc {
            color: #64748b;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .popular-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Contact Section */
        .contact-section {
            padding: 80px 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
            color: white;
            text-align: center;
        }

        .contact-box {
            max-width: 600px;
            margin: 40px auto 0;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 48px;
        }

        .contact-icon {
            font-size: 4rem;
            margin-bottom: 24px;
        }

        .contact-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .contact-note {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 16px;
        }

        /* Footer */
        .footer {
            background: #0f172a;
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
        }

        .footer-logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: white;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .footer-tagline {
            color: #3b82f6;
            font-weight: 600;
            margin-bottom: 24px;
            font-size: 1rem;
        }

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Floating Text Button (Mobile) */
        .floating-text {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.5);
            z-index: 999;
            text-decoration: none;
            animation: pulse 2s infinite;
            transition: transform 0.3s;
        }

        .floating-text:hover {
            transform: scale(1.1);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(59, 130, 246, 0.5); transform: scale(1); }
            50% { box-shadow: 0 15px 40px rgba(59, 130, 246, 0.7); transform: scale(1.05); }
        }

        /* Exit Popup */
        .exit-popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .exit-popup.show {
            display: flex;
        }

        .exit-popup-content {
            background: white;
            border-radius: 24px;
            padding: 48px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            animation: popupSlideIn 0.4s ease-out;
        }

        @keyframes popupSlideIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .exit-popup-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: #64748b;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .exit-popup-close:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

            font-size: 4rem;
            margin-bottom: 20px;
